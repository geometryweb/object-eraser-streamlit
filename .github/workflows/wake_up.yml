name: Keep Streamlit App Awake

on:
  schedule:
    # 12시간마다 실행 (한국 시간 기준 오전 9시, 오후 9시 / UTC 0시, 12시)
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Visit and Wake Up Streamlit App
        run: |
          node -e '
            const { chromium } = require("playwright");
            (async () => {
              const browser = await chromium.launch({ headless: true });
              const page = await browser.newPage();

              console.log("Streamlit 앱 접속 중...");
              await page.goto("https://object-eraser-app.streamlit.app", {
                waitUntil: "domcontentloaded",
                timeout: 60000
              });

              // 페이지 렌더링 대기
              await page.waitForTimeout(5000);

              const wakeButton = page.locator("button:has-text(\"Yes, get this app back up!\")");
              if (await wakeButton.count() > 0) {
                console.log("앱이 휴지기 상태여서 깨우기 버튼을 클릭합니다.");
                await wakeButton.click();

                // 깨우기 버튼이 사라질 때까지 최대 60초 대기 (앱 부팅 완료 확인)
                await wakeButton.waitFor({ state: "detached", timeout: 60000 }).catch(() => {
                  console.log("부팅 대기 시간 초과, 추가 대기로 넘어갑니다.");
                });

                console.log("앱 부팅 후 안정화를 위해 15초간 유지합니다.");
                await page.waitForTimeout(15000);
              } else {
                console.log("앱이 이미 깨어 있습니다.");
                await page.waitForTimeout(15000);
              }

              await browser.close();
              console.log("작업 완료.");
            })();
          '
